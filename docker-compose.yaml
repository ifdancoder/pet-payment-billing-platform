name: ${COMPOSE_PROJECT_NAME:-pet-payment-billing-platform}

services:
  gateway:
    image: nginx:1.29-alpine
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./infrastructure/nginx/resolver.docker-compose.conf:/etc/nginx/generated/resolver.conf:ro
      - ./infrastructure/nginx/dns_suffix.docker-compose.conf:/etc/nginx/generated/dns_suffix.conf:ro
    networks:
      - billing-network

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing}
      POSTGRES_DB: ${POSTGRES_DB:-billing}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-billing} -d ${POSTGRES_DB:-billing}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - billing-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-billing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-billing}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - billing-network

networks:
  billing-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres-data:
  rabbitmq-data:
