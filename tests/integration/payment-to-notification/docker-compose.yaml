name: billing-platform-test-payment-to-notification

# Brings up Notification (plus customer-service, its one synchronous
# dependency for looking up an email address) — not payment-service.
# Payment publishing payment.succeeded.v1 correctly is already covered
# by tests/integration/billing-to-payment/, so this test publishes it
# directly, standing in for Payment's own Outbox — same reasoning as
# every slice before it.
#
# Each app service runs its migration inline (`migrate --force` before
# `frankenphp`) rather than as a separate Job — see
# tests/integration/subscription-to-billing/docker-compose.yaml for why
# that's fine here but not in Kubernetes.

x-app-env: &app_env
  APP_ENV: production
  APP_KEY: base64:v5KVb+Iv/5UxJOwvOcCzm+9SjuY3diHhs71/JXj6G90=
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: billing
  DB_PASSWORD: billing
  SESSION_DRIVER: array
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: billing
  RABBITMQ_DEFAULT_PASS: billing

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: postgres
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 2s
      timeout: 5s
      retries: 30

  # AMQP port published to the host — this test publishes
  # payment.succeeded.v1 directly, standing in for Payment's own Outbox.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: billing
      RABBITMQ_DEFAULT_PASS: billing
    ports:
      - "29672:5672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      timeout: 5s
      retries: 30

  customer-service:
    build: ../../../services/customer-service
    command: sh -c "php artisan migrate --force && frankenphp php-server --listen :8080 --root /app/public"
    environment:
      <<: *app_env
      DB_DATABASE: customer
    ports:
      - "18001:8080"
    depends_on:
      postgres: {condition: service_healthy}

  notification-api:
    build: ../../../services/notification-service
    command: sh -c "php artisan migrate --force && frankenphp php-server --listen :8080 --root /app/public"
    environment:
      <<: *app_env
      DB_DATABASE: notification
      CUSTOMER_SERVICE_URL: http://customer-service:8080
    ports:
      - "18006:8080"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      customer-service: {condition: service_started}

  # Consumes the test-published payment.succeeded.v1 — the thing this
  # whole scenario is actually verifying — and creates a Pending
  # Notification.
  notification-ingest-consumer:
    build: ../../../services/notification-service
    command: sh -c "trap 'exit 0' TERM INT; while true; do php artisan payment-succeeded:consume; sleep 1 & wait $$!; done"
    environment:
      <<: *app_env
      DB_DATABASE: notification
      CUSTOMER_SERVICE_URL: http://customer-service:8080
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # A *different* consumer from the one above — of the Notification row
  # notification-ingest-consumer creates, not of a RabbitMQ event. Turns
  # Pending into Sent via the fake email sender (always succeeds, see
  # docs/architecture/testing-strategy.md's "Fake providers" section).
  notification-delivery-worker:
    build: ../../../services/notification-service
    command: sh -c "trap 'exit 0' TERM INT; while true; do php artisan notifications:deliver; sleep 1 & wait $$!; done"
    environment:
      <<: *app_env
      DB_DATABASE: notification
    depends_on:
      postgres: {condition: service_healthy}

# An explicit subnet, not Docker's auto-assigned pool — see
# tests/integration/subscription-to-billing/docker-compose.yaml for
# why. A different /24 than every other tests/integration/*/ and
# tests/e2e/*/ stack's, so all can run at once.
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.36.0.0/24
