name: billing-platform-test-payment-to-billing

# Brings up Billing and Payment with every workload role each of them
# has (api, consumer, outbox) — this scenario drives the real chain
# further than tests/integration/billing-to-payment/ does: not just
# "Payment succeeds," but "Billing translates that back into
# invoice.paid.v1." No subscription-service: same reasoning as
# billing-to-payment, the test seeds an Invoice by publishing
# subscription.created.v1 directly rather than pulling in a third
# service just to produce it.
#
# Each app service runs its migration inline (`migrate --force` before
# `frankenphp`) rather than as a separate Job — see
# tests/integration/subscription-to-billing/docker-compose.yaml for why
# that's fine here but not in Kubernetes.

x-app-env: &app_env
  APP_ENV: production
  APP_KEY: ${APP_KEY:?generated test env required}
  AUTH_ED25519_PUBLIC_KEY_BASE64: ${AUTH_ED25519_PUBLIC_KEY_BASE64:?generated test env required}
  INTERNAL_SERVICE_ACCESS_TOKEN: ${INTERNAL_SERVICE_ACCESS_TOKEN:?generated test env required}
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: billing
  DB_PASSWORD: ${POSTGRES_PASSWORD:?generated test env required}
  SESSION_DRIVER: array
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: billing
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?generated test env required}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated test env required}
      POSTGRES_DB: postgres
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 2s
      timeout: 5s
      retries: 30

  # AMQP port published to the host — this test publishes the seed
  # event directly and reads a test-bound queue to confirm
  # invoice.paid.v1 was republished, not just HTTP against each service.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: billing
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?generated test env required}
    ports:
      - "26672:5672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      timeout: 5s
      retries: 30

  billing-api:
    build:
      context: ../../..
      dockerfile: services/billing-service/Dockerfile
    command: sh -c "php artisan migrate --force && frankenphp php-server --listen :8080 --root /app/public"
    environment:
      <<: *app_env
      DB_DATABASE: billing
    ports:
      - "18004:8080"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # Consumes the test-published subscription.created.v1 (creates the
  # Invoice) and the real payment.succeeded.v1 payment-outbox publishes
  # further down this chain (marks it Paid, republishes invoice.paid.v1).
  billing-consumer:
    build:
      context: ../../..
      dockerfile: services/billing-service/Dockerfile
    command: sh -c "trap 'exit 0' TERM INT; while true; do php artisan billing-events:consume; sleep 1 & wait $$!; done"
    environment:
      <<: *app_env
      DB_DATABASE: billing
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  billing-outbox:
    build:
      context: ../../..
      dockerfile: services/billing-service/Dockerfile
    command: sh -c "trap 'exit 0' TERM INT; while true; do php artisan outbox:publish; sleep 1 & wait $$!; done"
    environment:
      <<: *app_env
      DB_DATABASE: billing
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  payment-api:
    build:
      context: ../../..
      dockerfile: services/payment-service/Dockerfile
    command: sh -c "php artisan migrate --force && frankenphp php-server --listen :8080 --root /app/public"
    environment:
      <<: *app_env
      DB_DATABASE: payment
    ports:
      - "18005:8080"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # Consumes the real invoice.created.v1 that billing-outbox publishes
  # and auto-creates + processes a Payment (the fake gateway always
  # succeeds today).
  payment-consumer:
    build:
      context: ../../..
      dockerfile: services/payment-service/Dockerfile
    command: sh -c "trap 'exit 0' TERM INT; while true; do php artisan invoice-created:consume; sleep 1 & wait $$!; done"
    environment:
      <<: *app_env
      DB_DATABASE: payment
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # Publishes payment.succeeded.v1 for real — the thing this whole
  # scenario is actually verifying reaches Billing.
  payment-outbox:
    build:
      context: ../../..
      dockerfile: services/payment-service/Dockerfile
    command: sh -c "trap 'exit 0' TERM INT; while true; do php artisan outbox:publish; sleep 1 & wait $$!; done"
    environment:
      <<: *app_env
      DB_DATABASE: payment
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

# An explicit subnet, not Docker's auto-assigned pool — see
# tests/integration/subscription-to-billing/docker-compose.yaml for
# why. A different /24 than the other two integration stacks', so all
# three can run at once.
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/24
