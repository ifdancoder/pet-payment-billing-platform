name: billing-platform-component-notification-service


x-app-env: &app_env
  APP_ENV: production
  APP_KEY: ${APP_KEY:?generated test env required}
  AUTH_ED25519_PUBLIC_KEY_BASE64: ${AUTH_ED25519_PUBLIC_KEY_BASE64:?generated test env required}
  INTERNAL_SERVICE_ACCESS_TOKEN: ${INTERNAL_SERVICE_ACCESS_TOKEN:?generated test env required}
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: notification
  DB_USERNAME: billing
  DB_PASSWORD: ${POSTGRES_PASSWORD:?generated test env required}
  SESSION_DRIVER: array
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: billing
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?generated test env required}
  CUSTOMER_SERVICE_URL: http://customer-stub:8080

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated test env required}
      POSTGRES_DB: postgres
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: billing
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?generated test env required}
    ports:
      - "34672:5672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      timeout: 5s
      retries: 30

  customer-stub:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__admin/mappings"]
      interval: 2s
      timeout: 5s
      retries: 30

  notification-api:
    build:
      context: ../../..
      dockerfile: services/notification-service/Dockerfile
    command: sh -c "php artisan migrate --force && frankenphp php-server --listen :8080 --root /app/public"
    environment: *app_env
    ports:
      - "18006:8080"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      customer-stub: {condition: service_healthy}

  notification-ingest-consumer:
    build:
      context: ../../..
      dockerfile: services/notification-service/Dockerfile
    command: sh -c "trap 'exit 0' TERM INT; while true; do php artisan payment-succeeded:consume; sleep 1 & wait $$!; done"
    environment: *app_env
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      customer-stub: {condition: service_healthy}

  notification-delivery-worker:
    build:
      context: ../../..
      dockerfile: services/notification-service/Dockerfile
    command: sh -c "trap 'exit 0' TERM INT; while true; do php artisan notifications:deliver; sleep 1 & wait $$!; done"
    environment: *app_env
    depends_on:
      postgres: {condition: service_healthy}

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.43.0.0/24
