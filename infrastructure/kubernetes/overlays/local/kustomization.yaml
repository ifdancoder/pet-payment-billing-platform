apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pet-payment-billing-platform

resources:
  - ../../base
  - ../../base/postgres
  - ../../base/rabbitmq
  - ../../base/customer
  - ../../base/catalog
  - ../../base/subscription
  - ../../base/billing
  - ../../base/identity
  - ../../base/payment
  - ../../base/notification
  - ../../base/availability
  - ../../base/gateway
  - ../../platform/ingress


patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=api
    path: api-topology-spread.yaml
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=api
    path: api-prestop.yaml
