---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-ingest-consumer
spec:
  scaleTargetRef: {name: notification-ingest-consumer}
  minReplicaCount: 1
  maxReplicaCount: 30
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: rabbitmq
      metadata: {protocol: amqp, mode: QueueLength, queueName: notification.payment-succeeded, value: "100"}
      authenticationRef: {name: rabbitmq}
