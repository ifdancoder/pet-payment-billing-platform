
server:
  retention: 7d
  extraFlags:
    - web.enable-remote-write-receiver
  persistentVolume:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false
