# prometheus-community/prometheus chart values, pinned to the version in
# kustomization.yaml. Check that version's default values.yaml before
# bumping it.
#
# Retention and storage are small on purpose. This is a pet project, not
# production.

server:
  retention: 7d
  extraFlags:
    - web.enable-remote-write-receiver
  persistentVolume:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false
