# grafana/loki chart values, pinned to the version in kustomization.yaml.
# Check that version's default values.yaml before bumping it.
#
# Single-binary mode with filesystem storage, fine for a pet project but
# not durable or HA. Switch to object storage / scalable mode before this
# needs to survive more than a pod restart.

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Not used in single-binary mode.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

gateway:
  enabled: false

test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
