# open-telemetry/opentelemetry-collector chart values, pinned to the
# version in kustomization.yaml. Check that version's default
# values.yaml before bumping it.
#
# Takes OTLP from application services (once they exist) and fans out:
# traces to Tempo, metrics to Prometheus (remote write), logs to Loki.

mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

replicaCount: 1

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  exporters:
    prometheusremotewrite:
      endpoint: http://prometheus-server.pet-payment-billing-platform.svc.cluster.local/api/v1/write
    otlp/tempo:
      endpoint: tempo.pet-payment-billing-platform.svc.cluster.local:4317
      tls:
        insecure: true
    loki:
      endpoint: http://loki.pet-payment-billing-platform.svc.cluster.local:3100/loki/api/v1/push

  service:
    pipelines:
      traces:
        receivers: [otlp]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        exporters: [loki]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
