apiVersion: batch/v1
kind: CronJob
metadata:
  name: subscription-renewals
  labels:
    app.kubernetes.io/component: renewal-scheduler
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: subscription
            app.kubernetes.io/component: renewal-scheduler
        spec:
          serviceAccountName: subscription
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: renew
              image: subscription-service:local
              imagePullPolicy: IfNotPresent
              command: ["php", "artisan", "subscriptions:renew"]
              envFrom:
                - configMapRef:
                    name: subscription-config
                - secretRef:
                    name: subscription-secret
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
