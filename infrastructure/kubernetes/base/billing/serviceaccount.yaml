# Shared by all three billing-service workload roles (api, outbox,
# consumer) and its migrate Job — named after the capability, not a
# single role, since none of them need Kubernetes API access either way
# (least privilege: none granted until something actually needs the
# Kubernetes API, which none of these do).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing
automountServiceAccountToken: false
