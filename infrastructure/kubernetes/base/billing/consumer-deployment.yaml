apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-consumer
  labels:
    app.kubernetes.io/component: consumer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: billing
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing
        app.kubernetes.io/component: consumer
    spec:
      serviceAccountName: billing
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: billing-consumer
          image: billing-service:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "trap 'exit 0' TERM INT; while true; do php artisan billing-events:consume; sleep 1 & wait $!; done"]
          envFrom:
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret
            - secretRef:
                name: rabbitmq-secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
