# The same image and routing config as the local docker-compose gateway
# (infrastructure/nginx/nginx.conf) — ADR 0001's whole point is one
# routing source of truth for both. ingress-nginx (installed separately,
# not managed by this repo) forwards to this Service; this is what
# actually does the per-resource /v1/... -> /api/v1/... routing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      # Generates /etc/nginx/generated/resolver.conf from this pod's own
      # /etc/resolv.conf (Kubernetes always points it at the cluster's
      # DNS Service, whatever its ClusterIP happens to be — never
      # hardcoded here), and /etc/nginx/generated/dns_suffix.conf from
      # this pod's own namespace (Downward API — same manifest works
      # unmodified across the local/staging/production overlays). The
      # docker-compose gateway instead bind-mounts static files with the
      # same names (127.0.0.11 / an empty suffix, since Docker's embedded
      # DNS resolves bare names directly) — same include targets in
      # nginx.conf, different source per environment. See
      # docs/adr/0003-kubernetes-foundation.md.
      initContainers:
        - name: generate-nginx-conf
          image: nginx:1.29-alpine
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - sh
            - -c
            - |
              echo "resolver $(awk '/^nameserver/{print $2; exit}' /etc/resolv.conf) valid=10s;" > /etc/nginx/generated/resolver.conf
              echo "map \"\" \$dns_suffix { default \".${POD_NAMESPACE}.svc.cluster.local\"; }" > /etc/nginx/generated/dns_suffix.conf
          volumeMounts:
            - name: generated
              mountPath: /etc/nginx/generated
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: gateway
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: config
              mountPath: /etc/nginx/proxy-common.conf
              subPath: proxy-common.conf
              readOnly: true
            - name: generated
              mountPath: /etc/nginx/generated
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gateway-nginx-conf
        - name: generated
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
