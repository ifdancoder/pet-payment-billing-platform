apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/part-of: billing-platform
    includeSelectors: true

resources:
  - deployment.yaml
  - service.yaml

# Generated from the same files the local docker-compose gateway mounts
# (infrastructure/nginx/) — one routing config for both environments,
# per ADR 0001.
configMapGenerator:
  - name: gateway-nginx-conf
    files:
      - nginx.conf=../../../nginx/nginx.conf
      - proxy-common.conf=../../../nginx/proxy-common.conf
