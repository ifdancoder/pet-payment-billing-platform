# Migrations run once, from one Job, before the Deployment's pods start
# serving traffic — not `php artisan migrate` on every API pod's
# startup, which would have N replicas race to migrate the same
# database concurrently (see docs/adr/0003-kubernetes-foundation.md).
# `kubectl apply` + `kubectl wait --for=condition=complete` on this Job
# is the deploy-time gate; nothing here re-runs it automatically on a
# plain rollout.
apiVersion: batch/v1
kind: Job
metadata:
  name: customer-migrate
  labels:
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: customer-api
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: customer-service:local
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: customer-config
            - secretRef:
                name: customer-secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
