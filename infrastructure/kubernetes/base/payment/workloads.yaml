apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels: {app.kubernetes.io/component: api}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: payment, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: payment, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: payment
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: payment-api
          image: payment-service:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: payment-config}
            - secretRef: {name: payment-secret}
            - secretRef: {name: rabbitmq-secret}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"], add: ["NET_BIND_SERVICE"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-consumer
  labels: {app.kubernetes.io/component: consumer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: payment, app.kubernetes.io/component: consumer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: payment, app.kubernetes.io/component: consumer}
    spec:
      serviceAccountName: payment
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: payment-consumer
          image: payment-service:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "trap 'exit 0' TERM INT; while true; do php artisan invoice-created:consume; sleep 1 & wait $!; done"]
          envFrom:
            - configMapRef: {name: payment-config}
            - secretRef: {name: payment-secret}
            - secretRef: {name: rabbitmq-secret}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-outbox
  labels: {app.kubernetes.io/component: outbox}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: payment, app.kubernetes.io/component: outbox}
  template:
    metadata:
      labels: {app.kubernetes.io/name: payment, app.kubernetes.io/component: outbox}
    spec:
      serviceAccountName: payment
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: payment-outbox
          image: payment-service:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "trap 'exit 0' TERM INT; while true; do php artisan outbox:publish; sleep 2 & wait $!; done"]
          envFrom:
            - configMapRef: {name: payment-config}
            - secretRef: {name: payment-secret}
            - secretRef: {name: rabbitmq-secret}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
