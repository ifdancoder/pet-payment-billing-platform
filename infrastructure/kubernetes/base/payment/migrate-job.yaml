apiVersion: batch/v1
kind: Job
metadata:
  name: payment-migrate
  labels: {app.kubernetes.io/component: migrate}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: payment, app.kubernetes.io/component: migrate}
    spec:
      serviceAccountName: payment
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: migrate
          image: payment-service:local
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef: {name: payment-config}
            - secretRef: {name: payment-secret}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
