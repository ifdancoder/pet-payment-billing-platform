apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app.kubernetes.io/component: cache}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: redis, app.kubernetes.io/component: cache}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/component: cache}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999}
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["redis-server", "--appendonly", "no", "--save", ""]
          ports: [{name: redis, containerPort: 6379}]
          startupProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
