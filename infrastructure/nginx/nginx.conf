events {}

http {
    # Generated per environment so upstream names resolve at request time.
    include /etc/nginx/generated/resolver.conf;

    include /etc/nginx/generated/dns_suffix.conf;

    server {
        listen 80;
        server_tokens off;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Authentication is enforced by downstream services.
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }



        location = /v1/merchants {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location = /v1/users {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location /v1/auth/ {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/memberships(/.*)?$ {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/api-keys(/.*)?$ {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }


        location ~ ^/v1/merchants/[^/]+/customers(/.*)?$ {
            set $upstream customer-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }


        location ~ ^/v1/merchants/[^/]+/products(/.*)?$ {
            set $upstream catalog-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/prices(/.*)?$ {
            set $upstream catalog-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/subscriptions(/.*)?$ {
            set $upstream subscription-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/invoices(/.*)?$ {
            set $upstream billing-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/payments(/.*)?$ {
            set $upstream payment-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/notifications(/.*)?$ {
            set $upstream notification-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location / {
            default_type application/json;
            return 503 '{"error":"no_services_available"}';
        }
    }
}
