events {}

http {
    # Resolving upstream hostnames at request time — not once at nginx
    # startup — means this gateway boots cleanly even before every
    # service it routes to actually exists (none do yet locally; they're
    # dockerized in a later phase, see
    # docs/adr/0001-api-gateway-routing.md). An unresolvable or down
    # upstream fails that one request with 502 instead of refusing to
    # start the gateway at all.
    #
    # The resolver IP itself is environment-specific (Docker Compose's
    # embedded DNS vs. Kubernetes' CoreDNS Service IP, which isn't fixed
    # across clusters) — generated per environment into this included
    # file rather than hardcoded here, see docs/adr/0003-kubernetes-foundation.md.
    include /etc/nginx/generated/resolver.conf;

    # nginx's resolver does a literal DNS query — it doesn't apply
    # /etc/resolv.conf's search-domain suffixes the way a normal client
    # would (verified: Kubernetes' CoreDNS answers the full
    # `customer-service.<namespace>.svc.cluster.local` but times out on
    # the bare short name or the 2-label form). $dns_suffix is appended
    # to every upstream hostname below so the same short service names
    # work in both environments — empty in Docker Compose (where the
    # embedded DNS resolves the bare name directly), the namespace's
    # `.svc.cluster.local` suffix in Kubernetes. See
    # docs/adr/0003-kubernetes-foundation.md.
    include /etc/nginx/generated/dns_suffix.conf;

    server {
        listen 80;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # ------------------------------------------------------------------
        # Every location below rewrites the public /v1/... path to each
        # service's actual /api/v1/... path and forwards the request as-is,
        # Authorization header included and unexamined. The gateway does
        # not authenticate — each service verifies the request locally.
        # See docs/adr/0001-api-gateway-routing.md for why.
        # ------------------------------------------------------------------

        # --- Identity ---------------------------------------------------
        # The one service with routes not nested under
        # /merchants/{merchant}/...: creating a Merchant, registering a
        # User, or logging in are the actions with no existing tenant
        # context to scope by.

        location = /v1/merchants {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location = /v1/users {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        # Not implemented yet — lands with identity-service's TokenIssuer
        # slice. Routed here already so the public contract doesn't shift
        # once it exists.
        location /v1/auth/ {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        # Not implemented yet — Membership's HTTP endpoints wait on
        # Authorization to guard them (see identity-service's commit
        # history: Add/ChangeRole/Remove/List are Application-only today).
        location ~ ^/v1/merchants/[^/]+/members(/.*)?$ {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        # Not implemented yet — same reason (ApiKey aggregate itself isn't
        # built yet).
        location ~ ^/v1/merchants/[^/]+/api-keys(/.*)?$ {
            set $upstream identity-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        # --- Customer -----------------------------------------------------
        # Not nested under /merchants/{merchant}/... like every other
        # service below — customer-service predates the tenant-context
        # convention and still takes merchant_id from the request body.
        # Left as-is here; fixing it is a customer-service change, not a
        # gateway one.

        location /v1/customers {
            set $upstream customer-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        # --- Everything else: /v1/merchants/{merchant}/{resource}... ------

        location ~ ^/v1/merchants/[^/]+/products(/.*)?$ {
            set $upstream catalog-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/prices(/.*)?$ {
            set $upstream catalog-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/subscriptions(/.*)?$ {
            set $upstream subscription-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/invoices(/.*)?$ {
            set $upstream billing-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/payments(/.*)?$ {
            set $upstream payment-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location ~ ^/v1/merchants/[^/]+/notifications(/.*)?$ {
            set $upstream notification-service$dns_suffix:8000;
            rewrite ^/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream;
            include /etc/nginx/proxy-common.conf;
        }

        location / {
            default_type application/json;
            return 503 '{"error":"no_services_available"}';
        }
    }
}
