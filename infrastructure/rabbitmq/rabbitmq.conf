# No management.load_definitions here on purpose: a definitions file
# that explicitly lists "users": [] (even to leave room for adding
# policies/queues later) suppresses RabbitMQ's normal bootstrap of the
# RABBITMQ_DEFAULT_USER/RABBITMQ_DEFAULT_PASS default user on first
# boot — the empty list is authoritative, not "nothing declared yet".
# Verified live: with that directive in place, `rabbitmqctl list_users`
# came back completely empty and every client connection failed with
# ACCESS_REFUSED. Exchanges and queues are declared by application code
# (see RabbitMqEventPublisher and the *_events:consume console
# commands) — this file has nothing left to load until there's an
# actual policy to define, and definitions.json stays as a template for
# that.
